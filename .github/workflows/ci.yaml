name: cicd

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'

jobs:
  ci:
    runs-on: ubuntu-latest


    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set short SHA
        shell: bash
        run: |
            echo "COMMIT_ID=${GITHUB_SHA::6}" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: alipendix/python-app:${{ env.COMMIT_ID }}

    outputs:
      commit_id ${{ env.COMMIT_ID }}

  cd:
    runs-on: self-hosted
    needs: [ci]
    

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
    
      - name: Modify values files
        shell: bash
        run: |
          echo ${{ needs.ci.outputs.commit_id }}
          pip install yq
          yq -Yi '.image.tag = ${{ needs.ci.outputs.commit_id }}' charts/python-app/values.yaml

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          message: "Update image tag to ${{ needs.ci.outputs.commit_id }}"

      - name: Install ArgoCD CLI
        shell: bash
        run: |
          curl -sSL -o argocd \
          https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv argocd /usr/local/bin/
          argocd version --client

      - name: Argocd app sync
        shell: bash
        run: |
          echo "Syncing ArgoCD application..."

          argocd login argocd-server.argocd.svc.cluster.local \
            --insecure \
            --grpc-web \
            --username admin \
            --password ${{ secrets.ARGOCD_PASSWORD }}

          argocd app sync python
      
  
         