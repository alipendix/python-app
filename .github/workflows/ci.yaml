name: cicd

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest

    outputs:
      commit_id: ${{ steps.vars.outputs.commit_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set short SHA
        id: vars
        shell: bash
        run: |
          echo "commit_id=${GITHUB_SHA::6}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: alipendix/python-app:${{ steps.vars.outputs.commit_id }}

  cd:
    runs-on: self-hosted
    needs: ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          curl -L \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -o yq
          chmod +x yq
          sudo mv yq /usr/local/bin/yq

      - name: Modify values file
        run: |
          echo "Commit ID: ${{ needs.ci.outputs.commit_id }}"
          yq -i '.image.tag = "${{ needs.ci.outputs.commit_id }}"' charts/python-app/values.yaml


      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          message: "Update image tag to ${{ needs.ci.outputs.commit_id }}"

      - name: Install ArgoCD CLI
        shell: bash
        run: |
          curl -sSL -o argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64

          chmod +x argocd
          sudo mv argocd /usr/local/bin/

          argocd version --client

      - name: ArgoCD app sync
        shell: bash
        run: |
          echo "Syncing ArgoCD application..."

          argocd login argocd-server.argocd.svc.cluster.local \
            --insecure \
            --grpc-web \
            --username admin \
            --password "${{ secrets.ARGOCD_PASSWORD }}"

          argocd app sync python